# Pull-request / push gate: the dependency-free node:test suite
# (badge strip/pick/count + real-plugin model-switch regressions).
# Zero dependencies — no install step, just run.
name: test

on:
  push:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ["22", "24"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: npm test
        run: npm test
